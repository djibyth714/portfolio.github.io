<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="teolia-bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="teolia-blue" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#teolia-bg)"/>

  <!-- Subtle glow -->
  <ellipse cx="960" cy="180" rx="380" ry="220" fill="#0078d4" fill-opacity="0.05"/>
  <ellipse cx="200" cy="520" rx="280" ry="180" fill="#00d4ff" fill-opacity="0.04"/>

  <!-- Grid lines -->
  <g stroke="#0078d4" stroke-width="1" opacity="0.06">
    <line x1="0" y1="67" x2="1200" y2="67"/>
    <line x1="0" y1="134" x2="1200" y2="134"/>
    <line x1="0" y1="201" x2="1200" y2="201"/>
    <line x1="0" y1="268" x2="1200" y2="268"/>
    <line x1="0" y1="335" x2="1200" y2="335"/>
    <line x1="0" y1="402" x2="1200" y2="402"/>
    <line x1="0" y1="469" x2="1200" y2="469"/>
    <line x1="0" y1="536" x2="1200" y2="536"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Badge label -->
  <rect x="60" y="56" width="160" height="32" rx="16" fill="#0078d4" fill-opacity="0.15" stroke="#0078d4" stroke-opacity="0.4" stroke-width="1"/>
  <text x="140" y="77" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">TEOLIA · 2024</text>

  <!-- Title -->
  <text x="60" y="152" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1" fill="white">Platform</text>
  <text x="60" y="210" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1" fill="url(#teolia-blue)">Engineering</text>
  <text x="60" y="248" font-family="Inter, Arial, sans-serif" font-size="15" fill="#8ba3c7">Self-service Cloud · Azure &amp; AWS · Terraform · SSO OpenID</text>

  <!-- Left panel: portal mockup -->
  <rect x="60" y="275" width="545" height="330" rx="12" fill="white" fill-opacity="0.02" stroke="white" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Browser chrome -->
  <rect x="60" y="275" width="545" height="34" rx="12" fill="#0078d4" fill-opacity="0.1"/>
  <rect x="60" y="296" width="545" height="13" fill="#0078d4" fill-opacity="0.1"/>
  <circle cx="87" cy="292" r="5" fill="#ef4444" fill-opacity="0.5"/>
  <circle cx="105" cy="292" r="5" fill="#f59e0b" fill-opacity="0.5"/>
  <circle cx="123" cy="292" r="5" fill="#10b981" fill-opacity="0.5"/>
  <rect x="148" y="285" width="280" height="14" rx="7" fill="white" fill-opacity="0.05"/>
  <text x="288" y="296" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" fill-opacity="0.5" text-anchor="middle">platform.teolia.fr</text>

  <!-- Form label -->
  <text x="88" y="332" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#8ba3c7" fill-opacity="0.7">Demande de ressources Cloud</text>

  <!-- Input fields -->
  <rect x="88" y="345" width="215" height="28" rx="6" fill="white" fill-opacity="0.03" stroke="#0078d4" stroke-opacity="0.25" stroke-width="1"/>
  <text x="102" y="364" font-family="Inter, Arial, sans-serif" font-size="10" fill="#8ba3c7" fill-opacity="0.5">Nom du projet...</text>
  <rect x="315" y="345" width="262" height="28" rx="6" fill="white" fill-opacity="0.03" stroke="#0078d4" stroke-opacity="0.25" stroke-width="1"/>
  <text x="329" y="364" font-family="Inter, Arial, sans-serif" font-size="10" fill="#8ba3c7" fill-opacity="0.5">Environnement (DEV / PROD)...</text>

  <!-- Resource cards row -->
  <rect x="88" y="388" width="112" height="78" rx="8" fill="#0078d4" fill-opacity="0.1" stroke="#0078d4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="144" y="414" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">VM Azure</text>
  <text x="144" y="430" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" text-anchor="middle">Static Web Apps</text>
  <text x="144" y="444" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" text-anchor="middle">+ Functions</text>
  <circle cx="144" cy="456" r="4" fill="#10b981" fill-opacity="0.7"/>

  <rect x="210" y="388" width="112" height="78" rx="8" fill="#0078d4" fill-opacity="0.1" stroke="#0078d4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="266" y="414" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">AWS EC2</text>
  <text x="266" y="430" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" text-anchor="middle">Amplify</text>
  <text x="266" y="444" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" text-anchor="middle">Lambda · API GW</text>
  <circle cx="266" cy="456" r="4" fill="#10b981" fill-opacity="0.7"/>

  <rect x="332" y="388" width="112" height="78" rx="8" fill="#0078d4" fill-opacity="0.1" stroke="#0078d4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="388" y="414" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">Réseau</text>
  <text x="388" y="430" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" text-anchor="middle">VPC · Subnets</text>
  <text x="388" y="444" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" text-anchor="middle">Security Groups</text>
  <circle cx="388" cy="456" r="4" fill="#f59e0b" fill-opacity="0.7"/>

  <rect x="454" y="388" width="118" height="78" rx="8" fill="#0078d4" fill-opacity="0.1" stroke="#0078d4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="513" y="414" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">Storage</text>
  <text x="513" y="430" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" text-anchor="middle">Azure Blob</text>
  <text x="513" y="444" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" text-anchor="middle">Terraform Backend</text>
  <circle cx="513" cy="456" r="4" fill="#10b981" fill-opacity="0.7"/>

  <!-- SSO tag + Deploy button -->
  <rect x="88" y="482" width="196" height="30" rx="6" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1"/>
  <text x="186" y="502" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#c4b5fd" text-anchor="middle">SSO · OpenID Connect</text>

  <rect x="392" y="482" width="178" height="32" rx="8" fill="#0078d4" fill-opacity="0.7" stroke="#0078d4" stroke-width="1"/>
  <text x="481" y="503" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">Deployer</text>

  <!-- Status line -->
  <text x="88" y="540" font-family="Inter, Arial, sans-serif" font-size="9" fill="#10b981" fill-opacity="0.8">Terraform plan OK · 12 ressources a creer</text>
  <text x="88" y="556" font-family="Inter, Arial, sans-serif" font-size="9" fill="#8ba3c7" fill-opacity="0.5">GitHub Actions pipeline : build - plan - apply</text>

  <!-- Right panel: pipeline steps -->
  <rect x="660" y="275" width="480" height="330" rx="12" fill="white" fill-opacity="0.015" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <text x="688" y="308" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#8ba3c7" fill-opacity="0.6">PIPELINE AUTOMATISE</text>

  <!-- Step 1 -->
  <rect x="688" y="320" width="422" height="44" rx="8" fill="#0078d4" fill-opacity="0.07" stroke="#0078d4" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="688" y="320" width="4" height="44" rx="2" fill="#0078d4"/>
  <text x="704" y="339" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">1. USER REQUEST</text>
  <text x="704" y="355" font-family="Inter, Arial, sans-serif" font-size="10" fill="#8ba3c7">Frontend HTML/CSS/JS - Saisie du formulaire</text>

  <!-- Step 2 -->
  <rect x="688" y="374" width="422" height="44" rx="8" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="688" y="374" width="4" height="44" rx="2" fill="#7c3aed"/>
  <text x="704" y="393" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#c4b5fd">2. GITHUB ACTIONS TRIGGER</text>
  <text x="704" y="409" font-family="Inter, Arial, sans-serif" font-size="10" fill="#8ba3c7">CI/CD declenche - terraform init + plan + apply</text>

  <!-- Step 3 -->
  <rect x="688" y="428" width="422" height="44" rx="8" fill="#10b981" fill-opacity="0.07" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="688" y="428" width="4" height="44" rx="2" fill="#10b981"/>
  <text x="704" y="447" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">3. AZURE / AWS PROVISIONING</text>
  <text x="704" y="463" font-family="Inter, Arial, sans-serif" font-size="10" fill="#8ba3c7">Terraform cree les ressources cloud demandees</text>

  <!-- Step 4 -->
  <rect x="688" y="482" width="422" height="44" rx="8" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="688" y="482" width="4" height="44" rx="2" fill="#f59e0b"/>
  <text x="704" y="501" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#fcd34d">4. NOTIFICATION</text>
  <text x="704" y="517" font-family="Inter, Arial, sans-serif" font-size="10" fill="#8ba3c7">Azure Functions sendmail - confirmation email</text>

  <!-- Step 5 -->
  <rect x="688" y="536" width="422" height="38" rx="8" fill="#00d4ff" fill-opacity="0.06" stroke="#00d4ff" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="688" y="536" width="4" height="38" rx="2" fill="#00d4ff"/>
  <text x="704" y="552" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#00d4ff">5. RESSOURCES PRETES</text>
  <text x="704" y="566" font-family="Inter, Arial, sans-serif" font-size="10" fill="#8ba3c7">Infrastructure operationnelle en quelques minutes</text>

  <!-- Bottom accent line -->
  <rect x="0" y="661" width="1200" height="3" fill="url(#teolia-blue)" opacity="0.7"/>
</svg>
