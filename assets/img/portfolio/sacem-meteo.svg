<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a18"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" style="stop-color:#00d4ff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed" stop-opacity="0.9"/>
      <stop offset="100%" style="stop-color:#7c3aed" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981" stop-opacity="0.9"/>
      <stop offset="100%" style="stop-color:#10b981" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <ellipse cx="900" cy="675" rx="400" ry="250" fill="#7c3aed" opacity="0.04"/>
  <ellipse cx="200" cy="0" rx="300" ry="180" fill="#00d4ff" opacity="0.04"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="67" x2="1200" y2="67"/><line x1="0" y1="134" x2="1200" y2="134"/>
    <line x1="0" y1="201" x2="1200" y2="201"/><line x1="0" y1="268" x2="1200" y2="268"/>
    <line x1="0" y1="335" x2="1200" y2="335"/><line x1="0" y1="402" x2="1200" y2="402"/>
    <line x1="0" y1="469" x2="1200" y2="469"/><line x1="0" y1="536" x2="1200" y2="536"/>
    <line x1="120" y1="0" x2="120" y2="675"/><line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="360" y1="0" x2="360" y2="675"/><line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/><line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="840" y1="0" x2="840" y2="675"/><line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Left panel -->
  <rect x="60" y="56" width="130" height="32" rx="16" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <text x="125" y="77" font-family="Inter,sans-serif" font-size="13" fill="#00d4ff" text-anchor="middle" font-weight="600">SACEM · 2025</text>

  <text x="60" y="145" font-family="Inter,sans-serif" font-size="52" fill="white" font-weight="800" letter-spacing="-2">Météo DSI</text>
  <text x="60" y="200" font-family="Inter,sans-serif" font-size="26" fill="rgba(139,163,199,0.7)" font-weight="400">Tableau de bord temps réel</text>
  <text x="60" y="235" font-family="Inter,sans-serif" font-size="16" fill="rgba(139,163,199,0.6)">React 18 · Node.js · PostgreSQL · Nginx</text>

  <!-- KPI cards -->
  <rect x="60" y="265" width="180" height="90" rx="10" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.2)" stroke-width="1.5"/>
  <text x="150" y="298" font-family="Inter,sans-serif" font-size="11" fill="rgba(139,163,199,0.7)" text-anchor="middle" font-weight="600">SONDES ACTIVES</text>
  <text x="150" y="332" font-family="Inter,sans-serif" font-size="36" fill="#00d4ff" text-anchor="middle" font-weight="800">59</text>

  <rect x="256" y="265" width="180" height="90" rx="10" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.2)" stroke-width="1.5"/>
  <text x="346" y="298" font-family="Inter,sans-serif" font-size="11" fill="rgba(139,163,199,0.7)" text-anchor="middle" font-weight="600">DISPONIBILITÉ</text>
  <text x="346" y="332" font-family="Inter,sans-serif" font-size="36" fill="#6ee7b7" text-anchor="middle" font-weight="800">99.8%</text>

  <rect x="452" y="265" width="180" height="90" rx="10" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.2)" stroke-width="1.5"/>
  <text x="542" y="298" font-family="Inter,sans-serif" font-size="11" fill="rgba(139,163,199,0.7)" text-anchor="middle" font-weight="600">TEMPS RÉEL</text>
  <text x="542" y="332" font-family="Inter,sans-serif" font-size="36" fill="#c4b5fd" text-anchor="middle" font-weight="800">JWT</text>

  <!-- Chart -->
  <rect x="60" y="375" width="590" height="200" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="80" y="402" font-family="Inter,sans-serif" font-size="11" fill="rgba(139,163,199,0.6)" font-weight="600">MÉTRIQUES APPLICATIVES</text>

  <!-- Chart bars -->
  <rect x="100" y="480" width="30" height="70" rx="4" fill="url(#bar1)" opacity="0.8"/>
  <rect x="150" y="455" width="30" height="95" rx="4" fill="url(#bar1)" opacity="0.8"/>
  <rect x="200" y="470" width="30" height="80" rx="4" fill="url(#bar2)" opacity="0.8"/>
  <rect x="250" y="440" width="30" height="110" rx="4" fill="url(#bar2)" opacity="0.8"/>
  <rect x="300" y="460" width="30" height="90" rx="4" fill="url(#bar1)" opacity="0.8"/>
  <rect x="350" y="430" width="30" height="120" rx="4" fill="url(#bar3)" opacity="0.8"/>
  <rect x="400" y="450" width="30" height="100" rx="4" fill="url(#bar3)" opacity="0.8"/>
  <rect x="450" y="420" width="30" height="130" rx="4" fill="url(#bar1)" opacity="0.8"/>
  <rect x="500" y="445" width="30" height="105" rx="4" fill="url(#bar2)" opacity="0.8"/>
  <rect x="550" y="435" width="30" height="115" rx="4" fill="url(#bar3)" opacity="0.8"/>
  <rect x="600" y="415" width="30" height="135" rx="4" fill="url(#bar1)" opacity="0.8"/>

  <!-- Chart baseline -->
  <line x1="80" y1="553" x2="650" y2="553" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Right panel: Stack -->
  <rect x="700" y="56" width="440" height="580" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="740" y="95" font-family="Inter,sans-serif" font-size="13" fill="rgba(139,163,199,0.6)" font-weight="600" letter-spacing="1">STACK TECHNIQUE</text>

  <!-- Stack items -->
  <g>
    <!-- Frontend -->
    <rect x="720" y="112" width="380" height="50" rx="8" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
    <rect x="720" y="112" width="4" height="50" rx="2" fill="#00d4ff"/>
    <text x="738" y="133" font-family="Inter,sans-serif" font-size="10" fill="rgba(139,163,199,0.6)" font-weight="600">FRONTEND</text>
    <text x="738" y="152" font-family="Inter,sans-serif" font-size="13" fill="white" font-weight="600">React 18 · TypeScript · Vite · Tailwind CSS</text>

    <!-- Backend -->
    <rect x="720" y="174" width="380" height="50" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
    <rect x="720" y="174" width="4" height="50" rx="2" fill="#7c3aed"/>
    <text x="738" y="195" font-family="Inter,sans-serif" font-size="10" fill="rgba(139,163,199,0.6)" font-weight="600">BACKEND</text>
    <text x="738" y="214" font-family="Inter,sans-serif" font-size="13" fill="white" font-weight="600">Node.js · Express · JWT/LDAP · REST API</text>

    <!-- Data -->
    <rect x="720" y="236" width="380" height="50" rx="8" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
    <rect x="720" y="236" width="4" height="50" rx="2" fill="#10b981"/>
    <text x="738" y="257" font-family="Inter,sans-serif" font-size="10" fill="rgba(139,163,199,0.6)" font-weight="600">DATA SOURCES</text>
    <text x="738" y="276" font-family="Inter,sans-serif" font-size="13" fill="white" font-weight="600">Prometheus · Centreon · Oracle · NetBackup</text>

    <!-- Infra -->
    <rect x="720" y="298" width="380" height="50" rx="8" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
    <rect x="720" y="298" width="4" height="50" rx="2" fill="#f59e0b"/>
    <text x="738" y="319" font-family="Inter,sans-serif" font-size="10" fill="rgba(139,163,199,0.6)" font-weight="600">INFRA</text>
    <text x="738" y="338" font-family="Inter,sans-serif" font-size="13" fill="white" font-weight="600">RHEL 9.4 · vSphere · Nginx TLS 1.3</text>

    <!-- Security -->
    <rect x="720" y="360" width="380" height="50" rx="8" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.15)" stroke-width="1"/>
    <rect x="720" y="360" width="4" height="50" rx="2" fill="#ef4444"/>
    <text x="738" y="381" font-family="Inter,sans-serif" font-size="10" fill="rgba(139,163,199,0.6)" font-weight="600">SÉCURITÉ</text>
    <text x="738" y="400" font-family="Inter,sans-serif" font-size="13" fill="white" font-weight="600">JWT · LDAP/AD · Fail2Ban · SELinux</text>

    <!-- CI/CD -->
    <rect x="720" y="422" width="380" height="50" rx="8" fill="rgba(20,184,166,0.06)" stroke="rgba(20,184,166,0.15)" stroke-width="1"/>
    <rect x="720" y="422" width="4" height="50" rx="2" fill="#14b8a6"/>
    <text x="738" y="443" font-family="Inter,sans-serif" font-size="10" fill="rgba(139,163,199,0.6)" font-weight="600">CI/CD</text>
    <text x="738" y="462" font-family="Inter,sans-serif" font-size="13" fill="white" font-weight="600">GitLab CI/CD · Systemd · Zero-downtime</text>
  </g>

  <!-- Accent bar -->
  <rect x="0" y="660" width="1200" height="3" fill="url(#line1)" opacity="0.6"/>
</svg>
