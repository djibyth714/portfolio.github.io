  <!--
    Row labels x=82, bars start x=82+label_offset
    px/year = 243.6
    Formula: x = 80 + (year - 2015) * 243.6 + (month-1)/12 * 243.6

    Simplified monthly positions (px/month ≈ 20.3):
    2015.0 = 80
    2015.75 = 80 + 0.75*243.6 = 262.7 → Aug 2015
    2017.0 = 567.3 → Aug 2017 = 567.3 + 0.583*243.6 = 709
    2017.833 = 567.3 + 0.833*243.6 = 710
    2017.917 = Nov 2017 → 567.3 + 0.833*243.6 = 710
    2017.917 = 567.3 + 0.917*243.6 = 790
    2017.958 = Dec 2017 = 567.3 + 0.958*243.6 = 800

    Let me compute key dates:
    Aug 2017  = 2017 + 7/12  = 80 + 2*243.6 + 7/12*243.6 = 80 + 487.2 + 142.1 = 709
    Nov 2017  = 2017 + 10/12 = 80 + 487.2 + 202.9 = 770
    Dec 2017  = 2017 + 11/12 = 80 + 487.2 + 223.3 = 790
    Oct 2017  = 2017 + 9/12  = 80 + 487.2 + 182.6 = 750

    Jan 2018 = 812
    Oct 2018 = 812 + 9/12*243.6 = 812 + 182.7 = 995
    Dec 2018 = 812 + 11/12*243.6 = 812 + 223.3 = 1035

    Oct 2019 = 1055 + 9/12*243.6 = 1055 + 182.7 = 1238
    Nov 2019 = 1055 + 10/12*243.6 = 1055 + 203 = 1258

    Sep 2020 = 1298 + 8/12*243.6 = 1298 + 162.4 = 1460
    Mar 2021 = 1541 + 2/12*243.6 = 1541 + 40.6 = 1582
    Aug 2021 = 1541 + 7/12*243.6 = 1541 + 142.1 = 1683
    Sep 2021 = 1541 + 8/12*243.6 = 1541 + 162.4 = 1703

    Oct 2021 = 1703 + 20 = 1723 (approx)
    Sep 2023 = 2028 + 8/12*243.6 = 2028 + 162.4 = 2190
    Nov 2023 = 2028 + 10/12*243.6 = 2028 + 203 = 2231
    Jan 2024 = 2271
    Apr 2024 = 2271 + 3/12*243.6 = 2271 + 61 = 2332
    May 2024 = 2271 + 4/12*243.6 = 2271 + 81 = 2352
    Jan 2025 = 2515
    Jun 2025 = 2515 + 5/12*243.6 = 2515 + 101.5 = 2617
    Nov 2025 = 2515 + 10/12*243.6 = 2515 + 203 = 2718
    Feb 2026 = 2759 + 1/12*243.6 = 2759 + 20 = 2779 (cap at 2759)
    Today ~Jun 2026 → 2759 (cap)
  -->

